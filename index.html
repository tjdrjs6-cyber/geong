    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="geongi-version" aria-label="게임 버전 0.44">v0.44</div>
    <script>
      (function () {
        function fitDesktop() {
          var root = document.getElementById('ui');
          if (!root) return;
          if (window.innerWidth <= 760) { root.style.removeProperty('--desktop-ui-scale'); return; }
          var factor = Math.min(window.innerWidth / 390, window.innerHeight / 844);
          root.style.setProperty('--desktop-ui-scale', String(Math.max(0.35, factor)));
        }
        window.addEventListener('resize', fitDesktop, { passive: true });
        fitDesktop();
      }());
    </script>
    <script type="module" src="/src/gacha.ts"></script>
  </body>
